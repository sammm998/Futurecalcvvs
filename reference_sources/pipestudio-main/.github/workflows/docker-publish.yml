name: Build and publish container

# Builds the detection image and pushes it to Docker Hub, from where Cloud Run
# can deploy it.
#
# Set two repository secrets first (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  your Docker Hub account name
#   DOCKERHUB_TOKEN     a Docker Hub access token (Account Settings → Security),
#                       NOT your password — a token can be revoked on its own
# Optionally set a repository variable DOCKERHUB_REPO to change the image name
# (defaults to <username>/pipe-detection).

on:
  push:
    # Publish the independent v2 service when main changes.
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (e.g. v1.0.0)'
        required: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if Docker Hub secrets are missing
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set as"
            echo "::error::repository secrets before this workflow can push."
            exit 1
          fi

      - name: Work out the image name
        id: img
        run: |
          REPO="${{ vars.DOCKERHUB_REPO }}"
          if [ -z "$REPO" ]; then REPO="${{ secrets.DOCKERHUB_USERNAME }}/pipe-detection"; fi
          echo "image=$REPO" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Build once into the local daemon and prove it actually runs before
      # anything is published — a broken image on Docker Hub is worse than a
      # failed build, because Cloud Run will happily roll it out.
      - name: Build (amd64 — what Cloud Run runs)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: detection_v2/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pipe-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          # Cloud Run injects PORT; check the container honours it rather than
          # the 5005 baked into EXPOSE.
          docker run -d --name smoke -e API_KEY=ci-test -e PORT=8080 -e OPENAI_API_KEY=ci-unused \
            -e CALLBACK_URL=https://example.invalid/callback \
            -e CALLBACK_KEY_ID=ci -e CALLBACK_HMAC_KEY=ci-secret \
            -p 8080:8080 pipe-detection:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:8080/health; echo
          echo "--- auth must reject a missing key ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                 http://127.0.0.1:8080/ -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "401" ] || { echo "expected 401, got $code"; docker logs smoke; exit 1; }
          echo "--- tesseract present (classification depends on it) ---"
          docker exec smoke tesseract --version | head -1
          docker exec smoke python -m unittest detection_v2.test_service detection_v2.test_studio_adapter detection_v2.test_queue -v
          docker rm -f smoke

      - name: Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: detection_v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Pushed to Docker Hub"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Cloud Run main trigger uses cloudbuild.yaml and POST / (contract 2.0.1)."
          } >> "$GITHUB_STEP_SUMMARY"
