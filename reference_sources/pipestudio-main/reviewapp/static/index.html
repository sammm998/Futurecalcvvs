<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipe Review Studio</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<!-- ── loading ─────────────────────────────────────────────────────────── -->
<div id="boot" class="boot">
  <div class="boot-card">
    <div class="boot-mark">◈</div>
    <h1>Pipe Review Studio</h1>
    <p id="bootStage">Starting…</p>
    <div class="boot-track"><div id="bootBar" class="boot-bar"></div></div>
  </div>
</div>

<!-- ── top bar ─────────────────────────────────────────────────────────── -->
<header id="topbar">
  <div class="brand"><span class="mark">◈</span><span>Pipe Review Studio</span></div>
  <div class="doc-name" id="docName">—</div>

  <div class="topbar-group">
    <button class="btn" id="btnUndo" data-tip="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn" id="btnRedo" data-tip="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>

  <div class="topbar-group">
    <button class="btn" id="btnFit" data-tip="Fit to screen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="btn" id="btnZoomSel" data-tip="Zoom to selection (⇧F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search pipe ID, class or label text…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>

  <div class="spacer"></div>

  <div id="assignState" class="assign-state ok">
    <span class="dot"></span><span id="assignText">Results are up to date</span>
  </div>
  <button class="btn" id="btnReassign" data-tip="Re-run classification">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
  </button>

  <div class="topbar-group">
    <button class="btn" id="btnSave" data-tip="Save review (⌘S)"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
    <button class="btn" id="btnMenu" data-tip="File menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
  </div>
</header>

<!-- ── wizard bar ──────────────────────────────────────────────────────── -->
<div id="wizard"></div>

<!-- ── left toolbar ────────────────────────────────────────────────────── -->
<aside id="toolbar"></aside>

<!-- ── workspace ───────────────────────────────────────────────────────── -->
<main id="workspace">
  <canvas id="scene"></canvas>
  <div id="marquee" class="marquee hidden"></div>

  <div id="minimap" class="minimap">
    <canvas id="minimapCanvas"></canvas>
    <div id="minimapView" class="minimap-view"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
</main>

<!-- ── right inspector ─────────────────────────────────────────────────── -->
<aside id="inspector">
  <div class="tabs">
    <button class="tab active" data-tab="inspect">Inspector</button>
    <button class="tab" data-tab="layers">Layers</button>
    <button class="tab" data-tab="history">History</button>
  </div>
  <div class="tab-body" id="tab-inspect"></div>
  <div class="tab-body hidden" id="tab-layers"></div>
  <div class="tab-body hidden" id="tab-history"></div>
</aside>

<!-- ── status bar ──────────────────────────────────────────────────────── -->
<footer id="statusbar">
  <span id="statTool">Select</span>
  <span class="sep"></span>
  <span id="statCursor">x 0.0, y 0.0 pt</span>
  <span class="sep"></span>
  <span id="statZoom">100%</span>
  <span class="sep"></span>
  <span id="statCounts">—</span>
  <div class="spacer"></div>
  <span id="statSel">No selection</span>
  <span class="sep"></span>
  <span id="statSaved">Saved</span>
</footer>

<div id="contextMenu" class="context-menu hidden"></div>
<div id="modal" class="modal-backdrop hidden"><div class="modal" id="modalBody"></div></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
