services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vvs
      POSTGRES_PASSWORD: vvs
      POSTGRES_DB: vvs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vvs"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      VVS_DATABASE_URL: postgresql+psycopg://vvs:vvs@db:5432/vvs
      VVS_STORAGE_ROOT: /data/storage
      VVS_SECRET_KEY: ${VVS_SECRET_KEY:-dev-secret-change-me}
      VVS_WORKER_THREADS: ${VVS_WORKER_THREADS:-1}
      VVS_RUN_DETERMINISM: ${VVS_RUN_DETERMINISM:-false}
      VVS_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  pgdata:
  storage:
